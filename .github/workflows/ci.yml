name: Vérification Quotidien
on:
  pull_request:
  push:
    branches: [main, 'fix/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Vérifier les écrans dans Chrome
        run: node scripts/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atelier-browser
          path: browser-artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: quotidien-static
          path: dist/
          include-hidden-files: true
